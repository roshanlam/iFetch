name: Publish container image

# Builds the iFetch container image and pushes it to the GitHub Container
# Registry.
#
# IMPORTANT (maintainer setup required):
# No secret needs to be created - the workflow authenticates to GHCR with the
# automatic GITHUB_TOKEN via `packages: write`. Two one-off steps are still
# needed on the GitHub side:
#   1. The first push creates the package as *private*. Open
#      https://github.com/users/<owner>/packages/container/ifetch/settings and
#      set its visibility to public if the image should be pullable anonymously.
#   2. On that same page, link the package to this repository so the README and
#      provenance show up on the package listing.
#
# Triggers:
#   * a v* tag  -> builds and pushes :X.Y.Z, :X.Y, :X and :latest
#   * a push to main -> pushes :edge, so the image is never stale between tags
#   * a pull request -> builds only, never pushes; a PR must not be able to
#     publish an image
#   * manual dispatch, for rebuilding on a base-image CVE with no code change

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required to attach a build attestation to the pushed image.
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped for pull requests: they build to verify the Dockerfile still
        # works and stop there.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=iFetch
            org.opencontainers.image.description=Bulk download, back up, and mirror your iCloud Drive from the command line

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # arm64 is not optional for this audience: a large share of the
          # homelab population runs a Raspberry Pi or an ARM NAS.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache through the registry rather than the runner: the GitHub
          # Actions cache is scoped per branch, so a tag build would otherwise
          # start cold every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test the image
        # A published image that cannot start is worse than no image. Only the
        # native architecture is loadable on the runner, so this checks amd64.
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --platform linux/amd64 -t ifetch:smoke .
          docker run --rm ifetch:smoke --help
